<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Livros - C & WebAssembly</title>
    <!-- Tailwind CSS para estilização rápida e bonita -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-sky-400">Biblioteca de Livros em C (WebAssembly)</h1>
            <p class="text-sm text-slate-400 mt-1">Lógica em C rodando direto no navegador com Emscripten</p>
        </header>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="text-center py-6 text-amber-400 font-medium">
            Carregando Módulo WebAssembly...
        </div>

        <!-- Conteúdo principal (escondido até carregar) -->
        <div id="app-content" class="hidden">
            <div class="flex flex-wrap gap-2 justify-center mb-6">
                <button onclick="executarOrdenacao(0)" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold transition shadow">Preço Crescente</button>
                <button onclick="executarOrdenacao(1)" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold transition shadow">Preço Decrescente</button>
                <button onclick="executarOrdenacao(2)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition shadow">Título (A-Z)</button>
                <button onclick="executarOrdenacao(3)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition shadow">Título (Z-A)</button>
            </div>

            <div class="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="py-3 px-4 font-semibold">Título do Livro</th>
                            <th class="py-3 px-4 font-semibold text-right">Preço</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-livros" class="divide-y divide-slate-800 text-sm">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let ordenarC, getTam, getTitulo, getPreco;

        // Configurando o objeto Module ANTES de carregar o script gerado
        var Module = {
            onRuntimeInitialized: function() {
                try {
                    // Mapeando as funções do C para o JS com cwrap
                    ordenarC = Module.cwrap('ordenar', null, ['number']);
                    getTam = Module.cwrap('get_tam', 'number', []);
                    getTitulo = Module.cwrap('get_livro_titulo', 'string', ['number']);
                    getPreco = Module.cwrap('get_livro_preco', 'number', ['number']);

                    // Esconde o aviso de carregamento e mostra a aplicação
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');

                    // Renderiza a lista inicial
                    atualizarTabela();
                } catch (e) {
                    document.getElementById('loading').innerText = "Erro ao inicializar o WebAssembly: " + e.message;
                    document.getElementById('loading').classList.add('text-red-400');
                }
            }
        };

        function atualizarTabela() {
            const tbody = document.getElementById('tabela-livros');
            tbody.innerHTML = '';

            const tamanho = getTam();
            for (let i = 0; i < tamanho; i++) {
                const titulo = getTitulo(i);
                const preco = getPreco(i);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-slate-200">${titulo}</td>
                    <td class="py-3 px-4 text-right text-emerald-400 font-mono">R$ ${preco.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function executarOrdenacao(tipo) {
            if (ordenarC) {
                ordenarC(tipo);
                atualizarTabela();
            }
        }
    </script>

    <!-- Script gerado pelo Emscripten carregado DEPOIS do Module -->
    <script src="ordenacao.js"></script>
</body>
</html>
